kind = "web"
previewPath = "/"
title = "Jakarta Gig Finder"
version = "1.0.0"
id = "artifacts/jakarta-gig-finder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20110

[services.development]
run = "pnpm --filter @workspace/jakarta-gig-finder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jakarta-gig-finder", "run", "build" ]
publicDir = "artifacts/jakarta-gig-finder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20110"
BASE_PATH = "/"
